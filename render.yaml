services:
  - type: web
    name: querymind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: QUERYMIND_SEMANTIC
        value: "0"
      - key: QUERYMIND_ADMIN_TOKEN
        generateValue: true
      - key: QUERYMIND_CORS_ORIGINS
        sync: false
